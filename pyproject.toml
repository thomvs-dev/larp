[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cimsim"
version = "0.1.0"
description = "SRAM compute-in-memory simulator for LLM inference: accuracy under analog non-idealities"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "pyyaml>=6.0",
    "numpy",
]

[project.optional-dependencies]
llm = ["transformers>=4.40", "datasets>=2.18", "accelerate"]
eval = ["lm-eval>=0.4"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["cimsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
