# A4: statistical mode, every linear layer on analog CIM. Bit-serial W8A8, nrow 128, ADC 6 b with
# MSE-calibrated full scale per layer (F5), no analog noise. Works for OPT, GPT-2, Llama, Qwen2 names.
default:
  mode: statistical
  macro: acim
  w_bits: 8
  x_bits: 8
  nrow: 128
  adc_bits: 6
  adc_range: calibrated
  adc_range_method: mse
  adc_range_gran: layer
  rand_noise_sigma: 0.0
