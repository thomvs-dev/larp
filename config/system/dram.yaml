# Off-chip DRAM for weights that are not resident in the CIM arrays (cimsim.system.DRAMSpec).
# Sources: docs/assumptions.md B-23, B-24.
default:
  e_bit: 3.97e-12          # J per bit read: HBM2, the most efficient DRAM in the cited comparison (lower bound)
  bandwidth_bits: 1.024e+11 # bits/s: one LPDDR5 x16 channel, 12.8 GB/s
  channels: 1
  source: "O'Connor et al., MICRO 2017 (HBM2 3.97 pJ/bit); Micron LPDDR5 data sheet MT62F (12.8 GB/s per channel)"
gddr5:
  e_bit: 14.0e-12          # J per bit: GDDR5 in the same comparison
  bandwidth_bits: 1.024e+11
  channels: 1
  source: "O'Connor et al., MICRO 2017, Fig. 1(a)"
ddr3:
  e_bit: 20.0e-12          # J per bit: 640 pJ per 32-b DRAM read (1.3-2.6 nJ per 64 b), 45 nm era
  bandwidth_bits: 1.024e+11
  channels: 1
  source: "Horowitz, ISSCC 2014, Fig. 1.1.9"
